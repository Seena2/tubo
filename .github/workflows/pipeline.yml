name: CI pipeline

on:
  push:
    paths:
      - '**.py'
      - 'pyproject.toml'
      - 'tests/**'
    branches: [main, dev] 
  pull_request:
    branches: [main, dev]

env:
  UV_CACHE_DIR: ${{ github.workspace }}/.uv_cache #cache directory for uv, this is a hidden directory in the root of the project, it is used to cache dependencies and speed up the pipeline
  UV_CACHE_ENABLED: true #enable caching for uv, this is a hidden directory in the root of the project, it is used to cache dependencies and speed up the pipeline

jobs:
  build-and-test:
    runs-on: ubuntu-latest #runs on fresh machine, no hidden state, no surpises from previous run
    defaults:
      run:
        working-directory: app #sets the working directory to the root of the project, this is where the code is checked out and where the pipeline will run
    
    # strategy:
    #   fail-fast: false
    #   matrix:
    #     python-version: ["3.12", "3.13", "3.14"]
    
    steps:
      - name: checkout code
        uses: actions/checkout@v6 #clones the repository into the runner, hence without the code pipeline has nothing to process
      
      - name: install uv
        uses: astral-sh/setup-uv@v10.4.0 #installs uv
        with:
          enable-cache: true

      # installs every dependency from uv.lock without modifying the lockfile. The --locked flag ensures CI fails if the lockfile is out of date. The --all-extras flag installs all optional dependency groups defined in pyproject.toml;
      # if your project has no optional dependencies, this flag is harmless but unnecessary. The --dev flag includes development dependencies like pytest and ruff.
      - run: uv sync --locked --all-extras --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      
      - name: List file
        run: ls -la # view what the pipeline see, used for debuging

      - name: echo message
        run: echo "pipeline is working"

      - name: Build docker image
        run: docker build -t tubo-image:latest . #builds a docker image with the tag tubo:latest, this is used to test if the code can be built into a docker image  
      
      - name: Run container
        run: docker run -d -p 5000:5000 --name tubo-container tubo-image:latest 

      - name: Wait for application to start
        run: sleep 10 #waits for the application to start, this is used to ensure that the application is running before running the tests

      - name: Fake test
        run: uv run pytest