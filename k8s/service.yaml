apiVersion: v1
kind: Service
metadata:
  name: tubo-service
  labels:
    app: tubo
spec:
  type: NodePort 
  selector:
    app: tubo # Matches the pod labels in k8s/deployment.yaml
  ports:
    - name: http
      protocol: TCP
      port: 80        # Cluster-internal service port
      targetPort: 5000 # Container port your Flask/Gunicorn app listens on
      nodePort: 30080  # External port exposed on the Kind node (30000-32767)
